name: Auto XSMB Cloud Live & Daily Sync

on:
  schedule:
    # 18:15 Giờ Việt Nam (11:15 UTC): Bắt đầu phiên quay trực tiếp G1 -> G5.6
    - cron: '15 11 * * *'
    # 18:35 Giờ Việt Nam (11:35 UTC): Chốt toàn bộ kết quả ngày & đồng bộ Dàn 58 lên 75
    - cron: '35 11 * * *'
    # 18:50 Giờ Việt Nam (11:50 UTC): Backup kiểm tra lần cuối
    - cron: '50 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run Radar Soi Cau G1-G5 Live
        run: |
          python soi_cau_g1_g5.py --live --max-minutes 20 --interval 10

      - name: Run Daily 58 Up To 75 Sync (if after 18h30)
        run: |
          if [ -d "58_up_to_75" ] && [ -f "58_up_to_75/update_daily.py" ]; then
            cd 58_up_to_75
            python update_daily.py || true
            cd ..
          fi
          # Đồng bộ dữ liệu mới nhất sang thư mục 58_up_to_75
          cp -f ket_qua_soi_cau_g1_g5.json 58_up_to_75/ || true
          cp -f soi_cau_g1_g5_app.html 58_up_to_75/ || true
          cp -f soi_cau_g1_g5.py 58_up_to_75/ || true

      - name: Commit and Push Cloud Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto: Cloud update Live G1-G5 & XSMB 2026 [skip ci]" && git push origin main)
